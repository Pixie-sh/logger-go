name: Go Test and Benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires 1.26; test against the floor and on stable to
        # surface forward-compat regressions as new releases land.
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -race -count=1 -cover

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Run benchmarks
        run: go test ./... -bench=. -benchmem -run=^$ -benchtime=2s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # v7 of the action pulls golangci-lint v2.x, which is built with a
      # Go toolchain new enough to lint go.mod's 1.26 floor. Older v6+v1
      # combos error with "language version used to build golangci-lint is
      # lower than the targeted Go version".
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m
